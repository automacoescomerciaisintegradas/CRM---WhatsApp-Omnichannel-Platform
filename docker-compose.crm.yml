version: '3.8'

services:
  crm-backend:
    image: whatsmiau2-backend:latest
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://chatwoot:chatwoot_secret_pass_2026@tasks.postgres:5432/crm
      - REDIS_URL=redis://:redis_secret_pass_2026@tasks.redis:6379/3
      - JWT_SECRET=whatsmiau2_super_secret_jwt_2026
      - EVOLUTION_API_URL=http://tasks.evolution_evolution_v2:8080
      - EVOLUTION_API_KEY=2wtLvtb20wXePp8D9uRhm55aCjINiciO14062025
    ports:
      - target: 4000
        published: 4000
        protocol: tcp
        mode: host
    networks:
      - network_public
      - chatwoot_chatwoot_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.crm-api.rule=Host(`api.iau2.com.br`)"
        - "traefik.http.routers.crm-api.entrypoints=websecure"
        - "traefik.http.routers.crm-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.crm-api.loadbalancer.server.port=4000"

  crm-frontend:
    image: whatsmiau2-frontend:latest
    ports:
      - target: 3001
        published: 3001
        protocol: tcp
        mode: host
    networks:
      - network_public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.crm.rule=Host(`crm.iau2.com.br`)"
        - "traefik.http.routers.crm.entrypoints=websecure"
        - "traefik.http.routers.crm.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.crm.loadbalancer.server.port=3001"

networks:
  network_public:
    external: true
  chatwoot_chatwoot_net:
    external: true
